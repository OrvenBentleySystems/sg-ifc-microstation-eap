name: release-package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment ZIP
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP "ifcsg-release"
          New-Item -ItemType Directory -Force $output | Out-Null
          .\tools\microstation\share_ifcsg_checker.ps1 `
            -Source $PWD `
            -OutputDir $output `
            -Zip
          Copy-Item (Join-Path $output "*.zip") "$PWD\"
      - uses: actions/upload-artifact@v4
        with:
          name: ifcsg-checker
          path: "*.zip"
      - name: Attach ZIP to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" *.zip --generate-notes
